name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Validate and package UPM release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate package
        run: python3 .github/scripts/validate_package.py

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Tag ${tag} does not match package version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build UPM archive and checksum
        shell: bash
        run: |
          package="com.essentials.blockbenchimporter"
          version="${{ steps.version.outputs.version }}"
          archive="${package}-${version}.tgz"
          mkdir -p "dist/${package}"
          rsync -a ./ "dist/${package}/" \
            --exclude .git \
            --exclude .github \
            --exclude dist
          tar -czf "${archive}" -C dist "${package}"
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          archive="com.essentials.blockbenchimporter-${version}.tgz"
          gh release create "${tag}" "${archive}" "${archive}.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Unity Blockbench Importer ${tag}"
