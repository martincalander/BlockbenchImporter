name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: UPM package and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate package structure and links
        run: python3 .github/scripts/validate_package.py

      - name: Validate Python script
        run: python3 -m py_compile .github/scripts/validate_package.py

      - name: Check whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" -- . ':(exclude)*.meta'

      - name: Parse workflow and issue-form YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/**/*.{yml,yaml}"].sort.each { |path| YAML.safe_load(File.read(path), aliases: true); puts "validated #{path}" }'
