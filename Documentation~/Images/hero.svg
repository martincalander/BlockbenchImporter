<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Unity Blockbench Importer</title>
  <desc id="desc">A polished open-source pipeline from Blockbench project files to native Unity assets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#111c33"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="420" rx="32" fill="url(#bg)"/>
  <circle cx="1020" cy="80" r="140" fill="#2563eb" opacity=".12" filter="url(#glow)"/>
  <circle cx="160" cy="380" r="180" fill="#2dd4bf" opacity=".08" filter="url(#glow)"/>
  <g transform="translate(90 92)">
    <path d="M78 25h112a42 42 0 0 1 42 42v39" fill="none" stroke="#3b82f6" stroke-width="22" stroke-linecap="round"/>
    <path d="M91 141l46 46 96-108" fill="none" stroke="#2dd4bf" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 48l43-25 43 25v50l-43 25L8 98z" fill="#2563eb"/>
    <path d="M8 48l43 25 43-25-43-25z" fill="#93c5fd"/>
    <path d="M51 73v50l43-25V48z" fill="#1d4ed8"/>
    <path d="M8 48v50l43 25V73z" fill="url(#blue)"/>
  </g>
  <g fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="408" y="132" font-size="22" font-weight="700" letter-spacing="4" fill="#60a5fa">OPEN-SOURCE UNITY PACKAGE</text>
    <text x="408" y="205" font-size="55" font-weight="800">Blockbench Importer</text>
    <text x="408" y="259" font-size="26" font-weight="500" fill="#cbd5e1">Author in Blockbench. Ship natively in Unity.</text>
  </g>
  <g transform="translate(408 302)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">
    <rect width="173" height="42" rx="21" fill="#172554" stroke="#3b82f6"/><text x="25" y="27" fill="#bfdbfe">DRAG &amp; DROP</text>
    <rect x="190" width="160" height="42" rx="21" fill="#0f2e2d" stroke="#2dd4bf"/><text x="218" y="27" fill="#99f6e4">1:1 FIDELITY</text>
    <rect x="367" width="171" height="42" rx="21" fill="#1e293b" stroke="#475569"/><text x="396" y="27" fill="#e2e8f0">UNITY 2021.3+</text>
  </g>
</svg>
